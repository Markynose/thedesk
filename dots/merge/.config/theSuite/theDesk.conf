; theDesk user settings (merged into ~/.config/theSuite/theDesk.conf by
; scripts/install-dots.sh; theDesk rewrites that file itself, so it is not
; symlinked). Avoid "," and ";" in values: QSettings treats them as list
; separators/comments.

[Session]
WindowManager=bspwm
; "/" = no arguments (bspwm reads ~/.config/bspwm/bspwmrc)
WindowManagerArguments=/

[Desktops]
; bspwm owns a fixed set of desktops (1-10 in bspwmrc)
dynamic=false

[Appearance]
; Themed app icons in the Gateway and taskbar: each app's icon as a duotone in
; the M3 colours on a tonal circle (false = the icons as they are)
themedIcons=true
; No compositor under bspwm: keep the bar opaque (also saves battery)
translucent=false

[Shortcuts]
; Meta+Return launches kitty instead of switching keyboard layout
nextlayoutAlternate=none
; Meta+L is "focus right" below
lockScreen=Meta+Escape

[CustomShortcuts]
; --- apps ---
Meta+W=firefox
Meta+Return=kitty
Meta+E=code

; --- windows ---
Meta+C=@close-window
Meta+Shift+C=@kill-window
Meta+F=bspc node -t ~fullscreen
Meta+S=bspc node -t ~floating
Meta+T=bspc node -t tiled
Meta+M=bspc desktop -l next
Alt+Tab=bspc node -f last.local.window

; focus / swap (vim keys)
Meta+H=bspc node -f west
Meta+J=bspc node -f south
Meta+K=bspc node -f north
Meta+L=bspc node -f east
Meta+Shift+H=bspc node -s west
Meta+Shift+J=bspc node -s south
Meta+Shift+K=bspc node -s north
Meta+Shift+L=bspc node -s east

; resize (~/.local/bin/bspc-resize; avoids quotes, which QSettings strips)
Meta+Alt+H=bspc-resize west
Meta+Alt+L=bspc-resize east
Meta+Alt+K=bspc-resize north
Meta+Alt+J=bspc-resize south

; layout
Meta+R=bspc node @/ -R 90
Meta+B=bspc node @/ -B
Meta+Ctrl+R=bspc wm -r

; --- desktops (Meta+0 = desktop 10) ---
Meta+1=bspc desktop -f ^1
Meta+2=bspc desktop -f ^2
Meta+3=bspc desktop -f ^3
Meta+4=bspc desktop -f ^4
Meta+5=bspc desktop -f ^5
Meta+6=bspc desktop -f ^6
Meta+7=bspc desktop -f ^7
Meta+8=bspc desktop -f ^8
Meta+9=bspc desktop -f ^9
Meta+0=bspc desktop -f ^10
Meta+Shift+1=bspc node -d ^1
Meta+Shift+2=bspc node -d ^2
Meta+Shift+3=bspc node -d ^3
Meta+Shift+4=bspc node -d ^4
Meta+Shift+5=bspc node -d ^5
Meta+Shift+6=bspc node -d ^6
Meta+Shift+7=bspc node -d ^7
Meta+Shift+8=bspc node -d ^8
Meta+Shift+9=bspc node -d ^9
Meta+Shift+0=bspc node -d ^10

[Splash]
; Loading screen exit: random (a different one each startup), or one of
; vortex bloom ripple drop sweep cascade
exit=random
; Loading text colours: scheme (M3 colours), mlm (the MLM pride flag), or rare
; (the flag now and then, about one startup in fifteen)
colours=scheme

[UserCard]
; Shape of your picture wherever your name shows (Gateway, lock screen,
; polkit prompt, Users settings): a MaterialShapes name like Cookie4Sided
; (fixed; it blooms out of a circle when shown), or several separated by
; commas to take turns. Names: m3/shapes/materialshapes.h
shapes=Cookie4Sided

[Horizon]
; Living horizon look: expressive (dark, Pixel "Hello"-style MaterialShapes
; that drift, turn and morph with the horizon) or classic (painted scenes)
style=expressive
