; Wallpapers (read by libtdesktopenvironment's BackgroundController).
; Rendered by scripts/render-wallpapers.sh; @HOME@ is expanded on install.
[desktop]
; horizon:living = live planet that follows the time of day (horizon:dusk-ocean etc. = fixed scene)
background=horizon:living
showLabels=false

[lockScreen]
; the living horizon (same colours as the clock and the rest); plays a sunset when
; the laptop sleeps and a sunrise on wake
background=horizon:living
