; Wallpapers (read by libtdesktopenvironment's BackgroundController).
; Rendered by scripts/render-wallpapers.sh; @HOME@ is expanded on install.
[desktop]
; shapes = the live shape wallpaper (Wallpaper/shapes in theDesk.conf; the old
; horizon:living names show it too)
background=shapes
showLabels=false

[lockScreen]
; the lock screen always wears the desktop's wallpaper, dimmed and zoomed in
background=shapes
