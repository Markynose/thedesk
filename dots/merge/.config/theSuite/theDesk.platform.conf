; theDesk platform theme: styling for theDesk and every Qt app in the session.
; Merged into ~/.config/theSuite/theDesk.platform.conf by scripts/install-dots.sh.

[Platform]
; Material3 = theDesk's Material 3 Expressive style (style-m3/), built from
; Compose's M3 tokens; colours come from the M3 palette below.
; Old look: style=Contemporary (deps/contemporary-theme) with base=gruvbox.
style=Material3
icons=Gruvbox-Plus-Dark
icons.fallback=Adwaita
; Symbols (actions, status) from Material Symbols Rounded (AUR
; ttf-material-symbols-variable-git), or theme to use the icon theme's own
icons.symbols=material
; theDesk-M3: Material 3 pointer (tools/m3-cursors), repainted in the M3
; colours at login; buttons swallow it on hover (hover=merge). Old: plan9
cursor=theDesk-M3
cursorSize=24
; Material 3 motion scheme: expressive (springy, bounces) or standard (calm)
motion=expressive
hover=merge

[Palette]
; m3 = Material 3 dynamic colour (m3/m3scheme.h), seeded from the living
; horizon: the tint follows the time of day with the wallpaper.
; Fallback: base=gruvbox (platform/palettes.json; accents orange yellow aqua
; blue green), which uses accent= below.
base=m3
accent=orange
; horizon, or a fixed seed colour like #d65d0e
m3.seed=horizon
; tonalspot vibrant expressive fidelity content neutral monochrome rainbow fruitsalad
m3.variant=tonalspot
; dark, light, or horizon (light 08:00-18:00)
m3.mode=dark
; -1 (reduced) to 1 (high)
m3.contrast=0

[Fonts]
system=Roboto Flex,10
fixed=Google Sans Code,11
