# kitty: Gruvbox Dark, keyboard-driven, battery friendly

# --- Font ---------------------------------------------------------------------
font_family      Google Sans Code
font_size        11
# Nerd Font icons (prompts, file managers) aren't in Google Sans Code: take
# just those ranges from Iosevka's Nerd build
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+23FB-U+23FE,U+2665,U+26A1,U+2B58 IosevkaTerm Nerd Font
disable_ligatures cursor

# --- Behaviour ----------------------------------------------------------------
shell            zsh
enable_audio_bell no
visual_bell_duration 0
confirm_os_window_close 0
scrollback_lines 10000
copy_on_select   no
strip_trailing_spaces smart
update_check_interval 0
# Lower GPU/CPU use on battery (default 10 / 3)
repaint_delay    15
input_delay      3
sync_to_monitor  yes

# --- Look ---------------------------------------------------------------------
window_padding_width 6
hide_window_decorations yes
cursor_shape     beam
cursor_blink_interval 0
tab_bar_style    powerline
tab_bar_edge     bottom
tab_powerline_style slanted

# Gruvbox Dark (hard-ish background)
foreground            #ebdbb2
background            #282828
selection_foreground  #282828
selection_background  #d65d0e
cursor                #ebdbb2
cursor_text_color     #282828
url_color             #83a598
active_border_color   #d79921
inactive_border_color #504945
active_tab_foreground   #282828
active_tab_background   #d79921
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
tab_bar_background      #1d2021

# black
color0  #282828
color8  #928374
# red
color1  #cc241d
color9  #fb4934
# green
color2  #98971a
color10 #b8bb26
# yellow
color3  #d79921
color11 #fabd2f
# blue
color4  #458588
color12 #83a598
# magenta
color5  #b16286
color13 #d3869b
# cyan
color6  #689d6a
color14 #8ec07c
# white
color7  #a89984
color15 #ebdbb2

# --- Keys (kitty-internal; global keys live in theDesk.conf) ------------------
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# theDesk writes the session's Material 3 colours here (they follow the
# living horizon); kept last so they win over the Gruvbox fallback above
include thedesk-m3.conf
