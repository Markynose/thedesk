<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- theDesk: "monospace" is Google Sans Code (GTK, Firefox, anything asking
     for the generic family), Nerd Font icons from Iosevka's Nerd build -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Google Sans Code</family>
      <family>IosevkaTerm Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
