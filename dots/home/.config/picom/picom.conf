# picom for theDesk (started from bspwmrc). theDesk sees the compositor and
# draws real translucency (scrims, antialiased rounded corners) instead of
# its screen-snapshot and window-mask stand-ins.

backend = "glx";
vsync = true;
use-damage = true;
# Fullscreen games and video skip compositing
unredir-if-possible = true;

# M3 elevation: soft, a little below the window
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.34;
shadow-offset-x = -16;
shadow-offset-y = -12;

rules = (
    # theDesk's floating toolbar (16 dp) and Gateway sheet (28 dp): with picom
    # running theDesk drops its window masks and lets picom round them
    { match = "name = 'theDesk bar'"; corner-radius = 16; },
    { match = "name = 'theDesk Gateway'"; corner-radius = 28; },

    # No shadows on the wallpaper, full-screen windows, or what draws its own
    { match = "window_type = 'desktop' || fullscreen || window_type = 'dnd'"; shadow = false; },
    { match = "class_i = 'td-locker' || class_i = 'startdesk' || name = 'theDesk (nested test)'"; shadow = false; },

    # Dialogs (theDesk's and apps'): the M3 dialog entrance, a fade as it
    # scales up from 90%, and a quicker exit. Not unmanaged windows (End
    # Session, the lock screen, the loading screen draw their own)
    { match = "window_type = 'dialog' && !override_redirect";
      animations = (
          { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.9; duration = 0.22; },
          { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.95; duration = 0.12; }
      );
    },

    # Apps (not theDesk's own windows, which animate themselves): they rise
    # into their tile from below like an Android app, with a spring's
    # overshoot, and sink away when closed. (No glide when tiles move: every
    # neighbour animated at once, heavy on an old GPU)
    { match = "class_i != 'thedesk' && class_i != 'startdesk' && class_i != 'td-locker' && class_i != 'td-polkitagent' && class_i != 'thedesk-desktop-portal' && class_i != 'thedesk-greeter' && window_type != 'desktop' && window_type != 'dock' && window_type != 'dialog'";
      animations = (
          { triggers = [ "open", "show" ];
            var-t = { curve = "cubic-bezier(0.3, 1.3, 0.5, 1)"; duration = 0.5; start = 0; end = 1; };
            offset-y = "80 * (1 - var-t)";
            scale-x = "0.94 + 0.06 * var-t"; scale-y = "scale-x";
            offset-x = "window-width * (1 - scale-x) / 2";
            opacity = { duration = 0.18; start = 0; end = 1; };
            shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
            shadow-opacity = "opacity";
          },
          { triggers = [ "close", "hide" ];
            var-t = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.22; start = 0; end = 1; };
            offset-y = "60 * var-t";
            opacity = "1 - var-t";
            shadow-offset-y = "offset-y"; shadow-opacity = "opacity";
          }
      );
    }
);
