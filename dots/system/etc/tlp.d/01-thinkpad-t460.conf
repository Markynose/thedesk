# TLP tuning for the ThinkPad T460 (installed by scripts/install-dots.sh --system)
# Docs: https://linrunner.de/tlp/settings/

# CPU (Skylake, intel_pstate)
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# Battery care: both packs (BAT0 internal, BAT1 removable). Charging starts
# below 75% and stops at 80%. Run `sudo tlp fullcharge BAT0` before a trip.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80

# Devices
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_BAT=powersupersave
USB_AUTOSUSPEND=1
# Uncomment to keep Bluetooth off at boot (theDesk's Status Center can turn it on)
#DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"
