# theDesk: full performance on AC power. Battery settings (and the charge
# thresholds) stay as 01-thinkpad-t460.conf sets them; later files win, so
# only the *_ON_AC values change here.

# CPU: the performance governor (intel_pstate) with the performance energy
# preference, turbo on, HWP dynamic boost on, the whole range allowed
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_AC=1

# Platform profile (ignored where the firmware has none)
PLATFORM_PROFILE_ON_AC=performance

# No link power saving on AC: PCIe and SATA at full speed
PCIE_ASPM_ON_AC=performance
SATA_LINKPWR_ON_AC="max_performance"
AHCI_RUNTIME_PM_ON_AC=on

# Devices stay awake on AC (as before), Wi-Fi without power saving
RUNTIME_PM_ON_AC=on
WIFI_PWR_ON_AC=off
