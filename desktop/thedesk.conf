[Onboarding]
lastOnboarding=0
order=OnboardingWelcome:OnboardingBetaThankYou:OnboardingRegion:OnboardingNetwork:OnboardingYou:OnboardingTheme:OnboardingTips:OnboardingShortcuts:OnboardingFinal
onboardingVideo=false
onboardingAudio=true
audio.start=/usr/share/thedesk/media/intro.ogg
audio.loop=/usr/share/thedesk/media/loop.ogg
videos.start=/usr/share/thedesk/media/welcome1.webm
videos.middle=/usr/share/thedesk/media/welcome2.webm
videos.loop=/usr/share/thedesk/media/welcome3.webm
welcomeGraphic=:/libthedesk/images/splash-background.svg

[StatusCenter]
panesOrder=OverviewPane:NetworkManagerPane:NotificationsPane
quickSwitchOrder=NetworkFlight:NetworkWireless:NetworkCellular:Bluetooth:PowerStretch:Redshift
settingsOrder=BluetoothSettings:DisplaySettings:ThemeSettings:InputSettings:PowerSettings:LocaleSettings:UsersSettings:DateTimeSettings:DefaultAppsSettings:AccessibilitySettings:SystemPluginManagement:SystemRecovery:SystemAbout

[Locale]
locales=en
formats=en_US

[Plugins]
blacklist=

[Appearance]
translucent=true

[Display]
dpi=96

[Session]
UseInitializationScript=false
InitializationScript=/etc/thedesk/init_thedesk.sh
WindowManager=kwin_x11
WindowManagerArguments=--replace:--no-kactivities

[Sounds]
; theDesk's sounds, by freedesktop sound name. theme = a folder in
; ~/.local/share/sounds or /usr/share/sounds (what it lacks comes from
; freedesktop). <name>=false turns one off, e.g. audio-volume-change=false
enabled=true
theme=thedesk
volume=1

[Emoji]
; Recently typed emoji and symbols (Super+.), newest first
recent=/

[Focus]
; Focus tide length (Meta+Z)
minutes=25

[Desktops]
; Keep exactly one empty desktop at the end (needs a WM that honours
; _NET_NUMBER_OF_DESKTOPS, e.g. KWin). Set false for bspwm/i3/etc.
dynamic=true

[Shortcuts]
; Override built-in shortcuts by name (QKeySequence text, "Super_L", or "none").
; Names: gatewayOpen statusCenter run force-stop lockScreen powerMenu nextlayout focusTide
;        nextlayoutAlternate screenshot screenshotAlt volumeUp volumeDown
;        volumeMute brightnessUp brightnessDown clipboard emoji recordStop colourPicker
; Asking KGlobalAccel to quit breaks KWin (and KWin script) shortcuts.
quitKGlobalAccel=false

[CustomShortcuts]
; Key sequence = command, or @close-window / @kill-window, e.g.
; Meta+W=firefox
